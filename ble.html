<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XIAO BLE 컨트롤</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d1f23;--mut:#6b7280;--on:#f59e0b;--ok:#10b981;--bad:#ef4444;--off:#d1d5db;--bd:#e5e7eb;--blue:#3b82f6}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--fg:#e8eaed;--mut:#9aa0aa;--off:#3a3f4a;--bd:#2a2e37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:24px 16px}
main{max-width:460px;margin:0 auto;display:grid;gap:16px}
h1{font-size:20px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h2{font-size:15px;margin:0;color:var(--mut);font-weight:600}
.dot{width:56px;height:56px;border-radius:50%;background:var(--off);transition:.15s;flex:none}
.dot.led{background:var(--on);box-shadow:0 0 24px var(--on)}
.dot.touch{background:var(--ok);box-shadow:0 0 24px var(--ok)}
.state{font-size:28px;font-weight:700;margin:8px 0 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
button{font:inherit;font-weight:600;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.p{background:var(--on);border-color:var(--on);color:#1d1f23}
button.b{background:var(--blue);border-color:var(--blue);color:#fff;width:100%}
.meta{color:var(--mut);font-size:13px;margin-top:10px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--off);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--off)}
.pill.on i{background:var(--ok)}.pill.err i{background:var(--bad)}
.note{font-size:13px;color:var(--mut);line-height:1.5;margin:10px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div>
    <h1>XIAO ESP32-S3 BLE 컨트롤</h1>
    <span class="pill" id="pill"><i></i><span id="pillTxt">연결 안 됨</span></span>
  </div>

  <section class="card">
    <button class="b" id="connBtn" onclick="toggleConn()">XIAO-BLE 연결</button>
    <p class="note" id="note">Android Chrome에서 열고, 휴대폰 블루투스와 위치를 켠 뒤 누르세요. 목록에서 <b>XIAO-BLE</b>을 고르면 됩니다.</p>
  </section>

  <section class="card">
    <div class="row">
      <div><h2>LED</h2><p class="state" id="ledTxt">-</p></div>
      <div class="dot" id="ledDot"></div>
    </div>
    <div class="btns">
      <button class="p" id="onBtn" onclick="setLed(1)" disabled>켜기</button>
      <button id="offBtn" onclick="setLed(0)" disabled>끄기</button>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <div><h2>터치 센서 (D0)</h2><p class="state" id="tTxt">-</p></div>
      <div class="dot" id="tDot"></div>
    </div>
    <div class="bar"><i id="tBar"></i></div>
    <p class="meta" id="tMeta"></p>
  </section>
</main>
<script>
const SVC = '9aa40001-1888-4c37-b030-73032fdf35af';
const LED = '9aa40002-1888-4c37-b030-73032fdf35af';
const TOUCH = '9aa40003-1888-4c37-b030-73032fdf35af';
const VAL = '9aa40004-1888-4c37-b030-73032fdf35af';
const ON_DELTA = 3000;  // must match the firmware

const $ = id => document.getElementById(id);
let device = null, ledCh = null;
let led = 0, touched = 0;

function pill(cls, txt) { $('pill').className = 'pill ' + cls; $('pillTxt').textContent = txt; }

function renderLed() {
  const lit = led || touched;
  $('ledTxt').textContent = lit ? (led ? '켜짐' : '켜짐 (터치)') : '꺼짐';
  $('ledDot').className = 'dot' + (lit ? ' led' : '');
}
function renderTouch() {
  $('tTxt').textContent = touched ? '터치됨' : '대기';
  $('tDot').className = 'dot' + (touched ? ' touch' : '');
  renderLed();
}

function setButtons(on) {
  $('onBtn').disabled = $('offBtn').disabled = !on;
  $('connBtn').textContent = on ? '연결 끊기' : 'XIAO-BLE 연결';
}

async function connect() {
  if (!navigator.bluetooth) {
    $('note').textContent = '이 브라우저는 Web Bluetooth를 지원하지 않습니다. Android Chrome을 쓰거나, nRF Connect 앱을 사용하세요.';
    pill('err', '지원 안 됨');
    return;
  }
  try {
    pill('', '기기 선택 중…');
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    pill('', '연결 중…');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);

    ledCh = await svc.getCharacteristic(LED);
    const touchCh = await svc.getCharacteristic(TOUCH);
    const valCh = await svc.getCharacteristic(VAL);

    led = (await ledCh.readValue()).getUint8(0);
    touched = (await touchCh.readValue()).getUint8(0);
    renderTouch();

    ledCh.addEventListener('characteristicvaluechanged', e => { led = e.target.value.getUint8(0); renderLed(); });
    touchCh.addEventListener('characteristicvaluechanged', e => { touched = e.target.value.getUint8(0); renderTouch(); });
    valCh.addEventListener('characteristicvaluechanged', e => {
      const [v, b, d] = new TextDecoder().decode(e.target.value).split(',').map(Number);
      $('tBar').style.width = Math.max(0, Math.min(100, d / ON_DELTA * 100)) + '%';
      $('tMeta').textContent = `값 ${v} · 기준 ${b} · 차이 ${d} (터치 기준 +${ON_DELTA})`;
    });
    await ledCh.startNotifications();
    await touchCh.startNotifications();
    await valCh.startNotifications();

    pill('on', '연결됨 · ' + device.name);
    setButtons(true);
  } catch (e) {
    if (e.name === 'NotFoundError') pill('', '연결 안 됨');  // user cancelled the picker
    else pill('err', '연결 실패: ' + e.message);
    setButtons(false);
  }
}

function onDisconnected() {
  ledCh = null;
  pill('err', '연결 끊김');
  setButtons(false);
}

function toggleConn() {
  if (device && device.gatt.connected) device.gatt.disconnect();
  else connect();
}

async function setLed(v) {
  if (!ledCh) return;
  try {
    await ledCh.writeValueWithResponse(new Uint8Array([v]));
    led = v; renderLed();
  } catch (e) { pill('err', '명령 전송 실패'); }
}
</script>
</body>
</html>
